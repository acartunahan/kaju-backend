# =====================================================================================
# Kullanıcıya dönen mesajlar (Türkçe). Dosya UTF-8 (spring.messages.encoding).
# Hata başlıkları: <anahtar>.baslik; açıklamalar: <anahtar>. Argümanlar {0}, {1}… ile.
# Kısıt bazlı özel mesaj: kisit.<KISIT_ADI> (yoksa genel mesaj kullanılır).
# Argümanlı mesajlarda tek tırnak '' ile yazılır (MessageFormat); argümansız mesajlarda MessageFormat
# uygulanmaz, bu yüzden tırnak olarak “ ” kullanılır.
# =====================================================================================

hata.gecersiz-istek.baslik=Geçersiz istek
hata.gecersiz-istek=İstek okunamadı ya da parametreleri geçersiz.

hata.dogrulama.baslik=Doğrulama hatası
