# =====================================================================================
# Kullanıcıya dönen mesajlar (Türkçe). Dosya UTF-8 (spring.messages.encoding).
# Hata başlıkları: <anahtar>.baslik; açıklamalar: <anahtar>. Argümanlar {0}, {1}… ile.
# Kısıt bazlı özel mesaj: kisit.<KISIT_ADI> (yoksa genel mesaj kullanılır).
# =====================================================================================

hata.gecersiz-istek.baslik=Geçersiz istek
hata.gecersiz-istek=İstek okunamadı ya da parametreleri geçersiz.

hata.dogrulama.baslik=Doğrulama hatası
hata.dogrulama=İstekte {0} alan hatası var.

hata.gecersiz-siralama.baslik=Geçersiz sıralama
hata.gecersiz-siralama=''{0}'' alanına göre sıralama yapılamaz.

hata.kayit-bulunamadi.baslik=Kayıt bulunamadı
hata.kayit-bulunamadi={0} bulunamadı (id: {1}).

hata.kaynak-bulunamadi.baslik=Kaynak bulunamadı
hata.kaynak-bulunamadi=İstenen adres bulunamadı.

hata.metot-desteklenmiyor.baslik=Desteklenmeyen işlem
hata.metot-desteklenmiyor=Bu adres bu HTTP metodunu desteklemiyor.

hata.surum-cakismasi.baslik=Sürüm çakışması
hata.surum-cakismasi={0} (id: {1}) siz düzenlerken başka biri tarafından değiştirildi. Kaydı yeniden yükleyip tekrar deneyin.

hata.tekillik-ihlali.baslik=Kayıt zaten var
hata.tekillik-ihlali=Bu değer başka bir kayıtta kullanılıyor.

hata.kayit-kullanimda.baslik=Kayıt kullanımda
hata.kayit-kullanimda={0} (id: {1}) silinemez: {3} aktif {2} kaydı buna bağlı.

hata.referans-gecersiz.baslik=Geçersiz referans
hata.referans-gecersiz=''{0}'' alanında verilen kayıt (id: {1}) bulunamadı ya da silinmiş.
hata.referans-gecersiz.tur=''{0}'' alanında verilen kayıt (id: {1}) bu işlem için uygun türde değil (beklenen: {2}).

hata.is-kurali.baslik=İş kuralı ihlali
hata.is-kurali=İstek bir iş kuralını ihlal ediyor.

hata.veri-kurali.baslik=Veri kuralı ihlali
hata.veri-kurali=Kayıt bir veri kuralını ihlal ediyor.

hata.beklenmeyen.baslik=Beklenmeyen hata
hata.beklenmeyen=İşlem sırasında beklenmeyen bir hata oluştu. Sorun sürerse sistem yöneticisine bildirin.

# --- Kısıt bazlı mesajlar (domain şemasındaki kısıt adları) ---------------------------
kisit.UK_ENVANTER_FOTOGRAFI_NESNE=Bu dosya anahtarı başka bir fotoğrafta kullanılıyor.
kisit.UX_ENVANTER_FOTOGRAFI_KAPAK=Bu kaydın zaten bir kapak fotoğrafı var.

# --- Ortak doğrulama mesajları (DTO'larda {anahtar} ile) ---------------------------
dogrulama.zorunlu=Bu alan zorunludur.
dogrulama.bos-olamaz=Bu alan boş olamaz.
dogrulama.en-fazla=En fazla {max} karakter olabilir.
dogrulama.pozitif=Sıfırdan büyük olmalıdır.
dogrulama.sifir-veya-pozitif=Negatif olamaz.
