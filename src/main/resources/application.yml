# =====================================================================================
# kaju-backend — ortak ayarlar (tüm profiller)
#
# Profiller: local (varsayılan, yerel Docker Oracle), test (Testcontainers), prod.
# Bağlantı bilgileri yalnızca ortam değişkenlerinden okunur; repoda şifre yoktur.
# =====================================================================================

spring:
  application:
    name: kaju-backend
  profiles:
    default: local

  jpa:
    open-in-view: false
    hibernate:
      # Şemayı yalnızca Flyway kurar (domain modülündeki script'ler); Hibernate sadece doğrular.
      ddl-auto: validate
    properties:
      hibernate:
        type:
          # LocalDateTime doğrudan JDBC ile bağlansın; JVM saat dilimi dönüşümü olmasın (domain sözleşmesi).
          java_time_use_direct_jdbc: true
        query:
          # Hibernate Oracle'da açılışta HTE_<TABLO> geçici tabloları oluşturmasın; şema Flyway'in.
          mutation_strategy:
            global_temporary:
              create_tables: false
              drop_tables: false

  flyway:
    # Domain şeması depo-domain jar'ındaki script'lerden gelir (V1–V999).
    locations: classpath:db/migration/domain
    # Göç uygulaması aynı şemaya V1000+ script'lerini de uygular; bu projede o script'ler yok. Domain'in son
    # sürümünden büyük oldukları için Flyway onları "future" sayar. Bu ayar Flyway'in varsayılanı "*:future"ı
    # ezdiği için ikisi de yazılır. out-of-order iki akışın sürüm sırası içindir (bkz. UygulamaEntegrasyonTesti).
    ignore-migration-patterns: "*:missing,*:future"
    out-of-order: true

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  mvc:
    problemdetails:
      enabled: true

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  web:
    locale: tr
    locale-resolver: fixed

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    tr.depo: INFO
