# Yerel geliştirme: kaju-migration reposundaki yerel Oracle (Docker Compose, localhost:1521/FREEPDB1).
# Şifre ortam değişkeninden: DB_SIFRE (yerel HEDEF kullanıcısının şifresi, kaju-migration/yerel-db/.env).
spring:
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_KULLANICI:HEDEF}
    password: ${DB_SIFRE}

logging:
  level:
    tr.depo: DEBUG
